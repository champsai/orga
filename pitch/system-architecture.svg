<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 880" width="1920" height="880" font-family="Futura, 'Futura PT', Jost, Prompt, Kanit, 'Leelawadee UI', 'Noto Sans Thai', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d4ae0"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0f8a66"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563c9"/></marker>
  </defs>

  <!-- column headers -->
  <g font-size="22" font-weight="700" fill="#64748b" letter-spacing="1">
    <text x="60" y="44">ผู้ใช้งาน · CLIENTS</text>
    <text x="690" y="44">ORCA BACKEND · Node.js</text>
    <text x="1520" y="44">บริการภายนอก · EXTERNAL</text>
  </g>

  <!-- ===== clients: the two chat apps lead, the back office stays quiet ===== -->
  <g>
    <rect x="60" y="70" width="360" height="112" rx="20" fill="#fff" stroke="#0e7490" stroke-width="4"/>
    <text x="86" y="112" font-size="27" font-weight="700" fill="#1f2937">แอปลูกค้า</text>
    <text x="86" y="142" font-size="19" fill="#64748b">Web · iOS · Android</text>
    <text x="86" y="168" font-size="19" font-weight="700" fill="#0e7490">✦ แชทกับ ORCA AI · ชำระเงิน</text>

    <rect x="60" y="200" width="360" height="112" rx="20" fill="#fff" stroke="#0e7490" stroke-width="4"/>
    <text x="86" y="242" font-size="27" font-weight="700" fill="#1f2937">แอปร้านค้า</text>
    <text x="86" y="272" font-size="19" fill="#64748b">Web · iOS · Android</text>
    <text x="86" y="298" font-size="19" font-weight="700" fill="#0e7490">✦ รับออเดอร์จาก ORCA AI</text>

    <rect x="60" y="330" width="360" height="112" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="86" y="372" font-size="24" font-weight="700" fill="#475569">หลังบ้าน ORCA</text>
    <text x="86" y="402" font-size="18" fill="#94a3b8">ทีมงาน ORCA</text>
    <text x="86" y="428" font-size="18" fill="#94a3b8">ยืนยันร้าน · ตัดสินข้อพิพาท</text>
  </g>
  <g stroke-width="6">
    <line x1="424" y1="126" x2="468" y2="126" stroke="#0e7490"/>
    <line x1="424" y1="256" x2="468" y2="256" stroke="#0e7490"/>
    <line x1="424" y1="386" x2="468" y2="386" stroke="#cbd5e1"/>
  </g>

  <!-- ===== gateway ===== -->
  <rect x="472" y="70" width="176" height="372" rx="20" fill="#17336f"/>
  <g text-anchor="middle" fill="#fff">
    <text x="560" y="140" font-size="27" font-weight="700">API</text>
    <text x="560" y="174" font-size="27" font-weight="700">Gateway</text>
    <text x="560" y="210" font-size="18" fill="#c7d4f0">HTTPS</text>
    <text x="560" y="234" font-size="18" fill="#c7d4f0">WebSocket</text>
    <line x1="500" y1="266" x2="620" y2="266" stroke="#3d5a9e" stroke-width="2"/>
    <text x="560" y="312" font-size="27" font-weight="700">Auth</text>
    <text x="560" y="346" font-size="18" fill="#c7d4f0">OTP · Google</text>
    <text x="560" y="370" font-size="18" fill="#c7d4f0">สิทธิ์ตามบทบาท</text>
  </g>
  <line x1="650" y1="256" x2="688" y2="256" stroke="#94a3b8" stroke-width="6"/>

  <!-- ===== backend services ===== -->
  <rect x="690" y="60" width="660" height="530" rx="28" fill="#eef2fb" stroke="#17336f" stroke-width="4"/>
  <g fill="#fff">
    <!-- AI chat: the heart of the product -->
    <rect x="710" y="82" width="308" height="154" rx="20" fill="none" stroke="#22d3ee" stroke-width="4" opacity=".55"/>
    <rect x="714" y="86" width="300" height="146" rx="18" fill="#0e7490"/>
    <text x="736" y="128" font-size="26" font-weight="700">ORCA AI Chat</text>
    <text x="736" y="162" font-size="18" fill="#d5f1f6">Real-time · WebSocket</text>
    <text x="736" y="190" font-size="18" fill="#d5f1f6">แชทลูกค้า–ORCA · ร้าน–ORCA</text>
    <text x="736" y="216" font-size="18" fill="#d5f1f6">เชื่อมกับงานเดียวกัน</text>

    <rect x="1026" y="86" width="300" height="146" rx="18" fill="#6d4ae0"/>
    <text x="1048" y="128" font-size="26" font-weight="700">Brief Decoder</text>
    <text x="1048" y="162" font-size="18" fill="#ece7ff">Gemini · Structured Output</text>
    <text x="1048" y="190" font-size="18" fill="#ece7ff">บรีฟ → Event DNA (JSON)</text>
    <text x="1048" y="216" font-size="18" fill="#ece7ff">อ่านข้อความตอบของร้าน</text>

    <rect x="714" y="246" width="300" height="146" rx="18" fill="#17336f"/>
    <text x="736" y="288" font-size="26" font-weight="700">Matching Engine</text>
    <text x="736" y="322" font-size="18" fill="#c7d4f0">Rule-based Scoring</text>
    <text x="736" y="350" font-size="18" fill="#c7d4f0">เทียบ Event DNA กับข้อมูลร้าน</text>
    <text x="736" y="376" font-size="18" fill="#c7d4f0">คัด 3 ร้านต่อหมวด</text>

    <rect x="1026" y="246" width="300" height="146" rx="18" fill="#2563c9"/>
    <text x="1048" y="288" font-size="26" font-weight="700">Order &amp; Change</text>
    <text x="1048" y="322" font-size="18" fill="#dbe6fb">สร้างและอัปเดตออเดอร์</text>
    <text x="1048" y="350" font-size="18" fill="#dbe6fb">คำนวณราคาเมื่อเปลี่ยนแผน</text>
    <text x="1048" y="376" font-size="18" fill="#dbe6fb">ถามร้านเมื่อจำเป็น</text>

    <rect x="714" y="406" width="300" height="166" rx="18" fill="#0f8a66"/>
    <text x="736" y="446" font-size="26" font-weight="700">Payment &amp; Escrow</text>
    <text x="736" y="478" font-size="17" fill="#d3f3e7">มัดจำ 30% · ยอดคงเหลือ</text>
    <text x="736" y="504" font-size="17" fill="#d3f3e7">เงินพักที่ Omise จนจบงาน</text>
    <text x="736" y="530" font-size="17" fill="#d3f3e7">จบงาน → โอนให้ร้าน</text>
    <text x="736" y="556" font-size="17" fill="#d3f3e7">คืนเงิน · ข้อพิพาท: หลังบ้าน ORCA</text>

    <rect x="1026" y="406" width="300" height="166" rx="18" fill="#c2410c"/>
    <text x="1048" y="446" font-size="26" font-weight="700">Notification</text>
    <text x="1048" y="480" font-size="18" fill="#ffe4d6">Push ในแอป · Email</text>
    <text x="1048" y="508" font-size="18" fill="#ffe4d6">ร้านได้ออเดอร์ · ลูกค้าได้คำตอบ</text>
    <text x="1048" y="536" font-size="18" fill="#ffe4d6">เตือนก่อนครบกำหนดจ่าย</text>
  </g>

  <!-- "AI" badges on the services where the AI does the work -->
  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="928" y="72" width="70" height="28" rx="14" fill="#fff" stroke="#0e7490" stroke-width="2"/>
    <text x="963" y="91" fill="#0e7490">✦ AI</text>
    <rect x="1240" y="72" width="70" height="28" rx="14" fill="#fff" stroke="#6d4ae0" stroke-width="2"/>
    <text x="1275" y="91" fill="#6d4ae0">✦ AI</text>
    <rect x="1240" y="232" width="70" height="28" rx="14" fill="#fff" stroke="#2563c9" stroke-width="2"/>
    <text x="1275" y="251" fill="#2563c9">✦ AI</text>
  </g>

  <!-- ===== external ===== -->
  <g>
    <rect x="1520" y="70" width="340" height="96" rx="18" fill="#fff" stroke="#6d4ae0" stroke-width="3"/>
    <text x="1544" y="110" font-size="25" font-weight="700" fill="#1f2937">Gemini API</text>
    <text x="1544" y="143" font-size="18" fill="#64748b">เข้าใจบรีฟภาษาไทยปนอังกฤษ</text>
    <rect x="1520" y="186" width="340" height="96" rx="18" fill="#fff" stroke="#0f8a66" stroke-width="3"/>
    <text x="1544" y="226" font-size="25" font-weight="700" fill="#1f2937">Omise / 2C2P</text>
    <text x="1544" y="259" font-size="18" fill="#64748b">รับชำระเงิน · โอนเงินให้ร้าน</text>
    <rect x="1520" y="302" width="340" height="96" rx="18" fill="#fff" stroke="#c2410c" stroke-width="3"/>
    <text x="1544" y="342" font-size="25" font-weight="700" fill="#1f2937">Firebase (FCM)</text>
    <text x="1544" y="375" font-size="18" fill="#64748b">ส่ง Push ไปมือถือ</text>
    <rect x="1520" y="418" width="340" height="96" rx="18" fill="#fff" stroke="#2563c9" stroke-width="3"/>
    <text x="1544" y="458" font-size="25" font-weight="700" fill="#1f2937">Google Calendar</text>
    <text x="1544" y="491" font-size="18" fill="#64748b">ซิงก์วันว่างของร้าน</text>
  </g>
  <!-- request out on top, answer back underneath -->
  <g stroke-width="5">
    <line x1="1356" y1="104" x2="1512" y2="104" stroke="#6d4ae0" marker-end="url(#aP)"/>
    <line x1="1358" y1="134" x2="1514" y2="134" stroke="#6d4ae0" marker-start="url(#aP)"/>
    <line x1="1356" y1="220" x2="1512" y2="220" stroke="#0f8a66" marker-end="url(#aG)"/>
    <line x1="1358" y1="250" x2="1514" y2="250" stroke="#0f8a66" marker-start="url(#aG)"/>
    <line x1="1356" y1="350" x2="1512" y2="350" stroke="#c2410c" marker-end="url(#aO)"/>
    <line x1="1358" y1="466" x2="1514" y2="466" stroke="#2563c9" marker-start="url(#aB)"/>
  </g>
  <g text-anchor="middle" font-size="15" fill="#64748b">
    <text x="1434" y="94">LLM Request →</text>
    <text x="1434" y="156">← Structured Output</text>
    <text x="1434" y="210">Payment API →</text>
    <text x="1434" y="272">← Webhook</text>
    <text x="1434" y="336">Push API →</text>
    <text x="1434" y="452">← Calendar API</text>
  </g>

  <!-- ===== data ===== -->
  <line x1="1020" y1="592" x2="1020" y2="650" stroke="#94a3b8" stroke-width="6"/>
  <text x="1036" y="628" font-size="17" fill="#64748b">SQL · Cache · Queue</text>
  <text x="472" y="636" font-size="22" font-weight="700" fill="#64748b" letter-spacing="1">ข้อมูล · DATA</text>
  <g>
    <rect x="472" y="652" width="268" height="140" rx="18" fill="#fff" stroke="#2563c9" stroke-width="3"/>
    <text x="606" y="698" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">PostgreSQL</text>
    <text x="606" y="732" text-anchor="middle" font-size="18" fill="#64748b">งาน · Event DNA (JSON)</text>
    <text x="606" y="760" text-anchor="middle" font-size="18" fill="#64748b">ร้าน · ออเดอร์ · แชท</text>
    <rect x="756" y="652" width="268" height="140" rx="18" fill="#fff" stroke="#2563c9" stroke-width="3"/>
    <text x="890" y="698" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">Object Storage</text>
    <text x="890" y="732" text-anchor="middle" font-size="18" fill="#64748b">รูปผลงานร้าน</text>
    <text x="890" y="760" text-anchor="middle" font-size="18" fill="#64748b">ไฟล์และสัญญางาน</text>
    <rect x="1040" y="652" width="268" height="140" rx="18" fill="#fff" stroke="#2563c9" stroke-width="3"/>
    <text x="1174" y="698" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">Redis</text>
    <text x="1174" y="732" text-anchor="middle" font-size="18" fill="#64748b">Cache · Job Queue</text>
    <text x="1174" y="760" text-anchor="middle" font-size="18" fill="#64748b">เตือนร้านที่ยังไม่ตอบ</text>
  </g>

  <!-- ===== cross-cutting ===== -->
  <rect x="60" y="470" width="360" height="322" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="86" y="512" font-size="25" font-weight="700" fill="#142c6e">Security · PDPA</text>
  <g font-size="19" fill="#475569">
    <text x="86" y="552"><tspan font-family="Prompt, sans-serif">•</tspan> เข้ารหัสข้อมูลลูกค้า</text>
    <text x="86" y="586"><tspan font-family="Prompt, sans-serif">•</tspan> แต่ละบทบาทเห็นข้อมูลเท่าที่จำเป็น</text>
    <text x="86" y="620"><tspan font-family="Prompt, sans-serif">•</tspan> ร้านไม่เห็นงบของลูกค้า</text>
    <text x="86" y="654"><tspan font-family="Prompt, sans-serif">•</tspan> บันทึกทุกการเปลี่ยนออเดอร์</text>
    <text x="86" y="688"><tspan font-family="Prompt, sans-serif">•</tspan> ช่องทางติดต่ออยู่ในแอปเท่านั้น</text>
  </g>
  <rect x="1336" y="652" width="524" height="140" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1360" y="690" font-size="25" font-weight="700" fill="#142c6e">Monitoring</text>
  <g font-size="18" fill="#475569">
    <text x="1360" y="722"><tspan font-family="Prompt, sans-serif">•</tspan> บันทึกเหตุการณ์และประวัติการเปลี่ยนแปลง</text>
    <text x="1378" y="746">โดยปกปิดข้อมูลอ่อนไหว</text>
    <text x="1360" y="776"><tspan font-family="Prompt, sans-serif">•</tspan> แจ้งเตือนเมื่อมีปัญหา · วัดเวลาตอบของร้าน</text>
  </g>
</svg>
